<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meadows Mavericks</title>
<meta name="theme-color" content="#14223A">
<meta name="description" content="House points for the Meadows Mavericks houses.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mavericks">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --sunk:#E3E8EE; --ink:#14223A; --muted:#566377; --line:#D3DAE3;
  --camels:#BD201B; --dhows:#1D7646; --falcons:#3C7BA8; --khanjars:#ECB547;
  --camels-ink:#fff; --dhows-ink:#fff; --falcons-ink:#fff; --khanjars-ink:#3A2C00;
  --focus:#3A6DC4;
  --display:"Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1626; --surface:#17223A; --sunk:#111B2E; --ink:#EEF2F8; --muted:#9BA8BC; --line:#2A3853; --focus:#8FB3FF;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1626; --surface:#17223A; --sunk:#111B2E; --ink:#EEF2F8; --muted:#9BA8BC; --line:#2A3853; --focus:#8FB3FF;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}

/* header */
.top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.gate{max-width:460px}
.gate form{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.gate .field{font-size:16px;width:100%}
.gate label{font-weight:700}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:64px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;margin-right:auto}
.stripes{display:grid;grid-template-columns:repeat(4,7px);gap:3px;height:30px}
.stripes i{display:block;border-radius:2px}
.brand b{font-family:var(--display);font-weight:900;font-size:1.65rem;letter-spacing:.01em;line-height:1}
nav{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:12px}
nav a{padding:7px 14px;border-radius:9px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.95rem}
nav a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,34,58,.12)}

main{padding:28px 0 64px}
h1,h2{font-family:var(--display);font-weight:800;line-height:1.05;margin:0}
h1{font-size:clamp(2.2rem,5vw,3.4rem)}
h2{font-size:1.6rem}
.sub{color:var(--muted);margin:6px 0 0}

/* segmented control */
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--sunk);padding:4px;border-radius:12px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer;font-size:.93rem}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,34,58,.12)}

/* the race */
.headrow{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.race{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,2vw,22px);align-items:end;height:clamp(360px,52vh,470px);padding:0 4px;border-bottom:4px solid var(--ink)}
.lane{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.lane .flag{font-family:var(--display);font-weight:800;font-size:clamp(.8rem,1.6vw,1rem);background:var(--ink);color:var(--bg);padding:3px 10px;border-radius:999px;margin-bottom:8px;white-space:nowrap;visibility:hidden}
.lane.lead .flag{visibility:visible}
.crest{width:min(80%,140px);aspect-ratio:260/340;margin-bottom:-22px;position:relative;z-index:2;filter:drop-shadow(0 4px 6px rgba(0,0,0,.22))}
.crest img{width:100%;height:100%;object-fit:contain;display:block}
.bar{width:100%;background:var(--hc);color:var(--hi);border-radius:14px 14px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:24px;padding-bottom:12px;min-height:170px;overflow:hidden;transition:height .7s cubic-bezier(.2,.8,.2,1)}
.bar .pts{font-family:var(--display);font-weight:900;font-size:clamp(2rem,5.5vw,3.6rem);line-height:1}
.bar .nm{font-weight:700;font-size:clamp(.72rem,1.6vw,.95rem);opacity:.92}
.bar .rk{font-size:.78rem;font-weight:600;opacity:.85;margin-top:2px}
.bar .nm,.bar .rk,.bar .staffline{max-width:100%;padding:0 6px;text-align:center}
@media (prefers-reduced-motion: reduce){.bar{transition:none}}
.verdict{margin:18px 0 0;font-size:1.05rem;color:var(--muted)}
.verdict strong{color:var(--ink)}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:40px}
.cols.three{grid-template-columns:repeat(3,1fr)}
@media (max-width:980px){.cols.three{grid-template-columns:1fr 1fr}.cols.three > :last-child{grid-column:1/-1}}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.panel h2{font-size:1.35rem;margin-bottom:12px}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--hc)}
.rows .grow{flex:1;min-width:0}
.rows .meta{color:var(--muted);font-size:.85rem}
.rows .num{font-family:var(--display);font-weight:800;font-size:1.35rem;white-space:nowrap}
.empty{color:var(--muted);padding:6px 0;margin:0}
.minibar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:5px;background:var(--sunk)}
.minibar i{display:block;height:100%}

/* teachers list */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 20px}
.field{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.field:focus{border-color:var(--focus);outline:none}
.toolbar .field{flex:1 1 220px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.link{background:none;color:var(--muted);padding:6px 8px;font-weight:600;text-decoration:underline}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tcard{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.tcard:hover{border-color:var(--ink)}
.tcard.hc{border-left:6px solid var(--hc)}
.hgroup{margin-bottom:26px}
.hgroup h2{display:flex;align-items:center;gap:10px;font-size:1.45rem;margin-bottom:12px}
.hgroup h2 img{width:34px;height:44px;object-fit:contain}
.hgroup h2 img.mav{width:44px;height:44px;object-fit:cover;border-radius:10px;box-shadow:0 1px 3px rgba(20,34,58,.25)}
.lvl{position:relative}
.lvl .mavsm{position:absolute;top:10px;right:10px;width:36px;height:36px;object-fit:cover;border-radius:9px;box-shadow:0 1px 3px rgba(20,34,58,.25)}
.lvl .n{padding-right:42px}
.hgroup h2 small{font-family:var(--body);font-size:.9rem;font-weight:600;color:var(--muted)}
.hgroup h2 .sw{width:14px;height:14px;border-radius:50%;background:var(--line)}
.housepick{display:flex;flex-wrap:wrap;gap:6px}
.hchip{border:2px solid var(--hc);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;cursor:pointer;font-size:.93rem}
.hchip[aria-pressed="true"]{background:var(--hc);color:var(--hi)}
.addrow{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.addrow .field{max-width:420px}
.tag{display:inline-flex;align-items:center;gap:8px;background:var(--hc);color:var(--hi);border-radius:999px;padding:4px 12px 4px 4px;font-weight:700;font-size:.95rem}
.tag img{width:24px;height:31px;object-fit:contain}
.staffline{margin-top:4px;font-size:clamp(.66rem,1.4vw,.8rem);opacity:.85}
.tcard b{display:block;font-size:1.05rem}
.tcard span{color:var(--muted);font-size:.85rem}

/* teacher page */
.back{color:var(--muted);text-decoration:none;font-weight:600;font-size:.95rem}
.award{margin-top:22px}
.step{margin:0 0 20px}
.step > label, .step > .lbl{display:block;font-weight:700;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer;font-size:.93rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.add{border-style:dashed;color:var(--muted)}
.houses{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:520px){.houses{grid-template-columns:repeat(2,1fr)}}
.hbtn{border:3px solid var(--hc);background:var(--surface);border-radius:14px;padding:10px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700}
.hbtn img{width:56px;height:68px;object-fit:contain;background:#fff;border-radius:8px}
.hbtn[aria-pressed="true"]{background:var(--hc);color:var(--hi)}
.pts-row{display:flex;gap:8px;flex-wrap:wrap}
.pbtn{width:58px;height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--display);font-weight:900;font-size:1.5rem;cursor:pointer}
.pbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:900px){.levels{grid-template-columns:repeat(2,1fr)}}
@media (max-width:420px){.levels{grid-template-columns:1fr}}
.lvl{--lc:var(--line);display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:2px solid var(--line);border-top:6px solid var(--lc);background:var(--surface);border-radius:14px;padding:12px 14px;cursor:pointer;min-width:0}
.lvl:hover{border-color:var(--lc)}
.lvl .n{font-family:var(--display);font-weight:900;font-size:2.1rem;line-height:1}
.lvl .n small{font-size:.95rem;font-weight:800;margin-left:3px}
.lvl .t{font-weight:700;font-size:1rem;line-height:1.2}
.lvl .d{color:var(--muted);font-size:.8rem;line-height:1.35}
.lvl[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);border-top-color:var(--lc)}
.lvl[aria-pressed="true"] .d{color:inherit;opacity:.8}
.lvl[aria-pressed="true"] .t::before{content:"✓ "}
.rgroup{margin-top:4px}
.rgroup + .rgroup{margin-top:12px}
.rgroup .hint{display:block;margin-bottom:6px}
.rchip{text-align:left}
.twofield{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:620px){.twofield{grid-template-columns:1fr}}
.twofield .field{width:100%}
.submit{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.submit .btn{padding:14px 22px;font-size:1.05rem}
.hint{color:var(--muted);font-size:.9rem}
.danger{margin-top:28px}
#clearAll.armed{background:var(--camels);color:#fff;border-color:var(--camels)}
.pend{display:block;margin-top:4px;font-size:.92rem}
.picker{border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.picker-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px;background:var(--sunk);border-bottom:1px solid var(--line)}
.picker-top .field{flex:1 1 220px}
.slist{max-height:360px;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px;padding:10px}
.sbtn{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;cursor:pointer;min-width:0}
.sbtn .dot{flex:none}
.sbtn span.t{min-width:0}
.sbtn b{display:block;font-weight:600;font-size:.93rem;line-height:1.25;overflow-wrap:anywhere}
.sbtn small{color:var(--muted);font-size:.8rem}
.sbtn[aria-pressed="true"]{border-color:var(--ink);background:var(--sunk);box-shadow:inset 0 0 0 1px var(--ink)}
.sbtn[aria-pressed="true"] b::before{content:"✓ "}
.picker-empty{padding:14px;color:var(--muted);margin:0}
.selbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.selchip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 6px 4px 10px;font-size:.88rem;font-weight:600;background:var(--sunk);border:1.5px solid var(--hc)}
.selchip button{border:0;background:none;cursor:pointer;font-size:1rem;line-height:1;padding:2px 4px;color:var(--muted)}

.notice{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:20px;font-size:.95rem}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100vw - 40px);z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pickgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:760px){.pickgrid{grid-template-columns:1fr}}
.results{list-style:none;margin:8px 0 0;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.results:empty{display:none}
.results li + li{border-top:1px solid var(--line)}
.sbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:10px 12px;cursor:pointer}
.sbtn:hover{background:var(--sunk)}
.sbtn[aria-pressed="true"]{background:var(--sunk)}
.sbtn .grow{flex:1;min-width:0}
.sbtn .meta{color:var(--muted);font-size:.85rem}
.sbtn .tick{font-weight:800;color:var(--muted);width:20px;text-align:center}
.sbtn[aria-pressed="true"] .tick{color:var(--ink)}
.dot.none{background:transparent;border:2px dashed var(--muted)}
.formlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.schip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 8px;cursor:pointer;font-size:.9rem;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.schip .dot{width:10px;height:10px}
.schip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tray{background:var(--sunk);border-radius:12px;padding:12px;min-height:52px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tray .schip{cursor:default}
.tray .x{border:0;background:none;cursor:pointer;font-weight:800;padding:0 2px;color:inherit}
.tray .empty{padding:0}
.linkrow{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-top:6px}
select.field{padding:9px 10px}
.hsum{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:16px 0 24px}
@media (max-width:620px){.hsum{grid-template-columns:repeat(2,1fr)}}
.hsum div{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--hc,var(--line));border-radius:12px;padding:12px}
.hsum b{display:block;font-family:var(--display);font-size:2rem;font-weight:900;line-height:1}
.hsum span{color:var(--muted);font-size:.9rem}
textarea.field{width:100%;min-height:150px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9rem;resize:vertical}
.pending{margin:10px 0 0;color:var(--muted);font-size:.95rem}
.table-wrap{overflow-x:auto}
.srow{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow .grow{flex:1;min-width:0}
.srow .meta{color:var(--muted);font-size:.85rem}
.srow select{max-width:150px}

@media (max-width:560px){
  .top{position:static}
  .top .wrap{gap:8px;padding-top:10px;padding-bottom:10px}
  .brand b{font-size:1.35rem}
  .stripes{height:24px;grid-template-columns:repeat(4,5px)}
  nav{width:100%}
  nav a{flex:1;text-align:center;padding:8px 6px;white-space:nowrap;font-size:.9rem}
  main{padding-top:18px}
  .toolbar .field{font-size:16px}
}

.exportbox{display:none}
body.can-dl .exportbox{display:block}
nav a[data-nav="students"]{display:none}
body.owner nav a[data-nav="students"]{display:block}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#/">
      <span class="stripes" aria-hidden="true"><i style="background:var(--camels)"></i><i style="background:var(--dhows)"></i><i style="background:var(--falcons)"></i><i style="background:var(--khanjars)"></i></span>
      <b>Meadows Mavericks</b>
    </a>
    <nav aria-label="Main">
      <a href="#/" data-nav="home">Standings</a>
      <a href="#/teachers" data-nav="teachers">Give points</a>
      <a href="#/students" data-nav="students">Students</a>
    </nav>
  </div>
</header>
<main class="wrap" id="app"></main>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ymKey = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
function startOfWeek(d){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function schoolYearStart(d){ return new Date(d.getMonth()>=7 ? d.getFullYear() : d.getFullYear()-1, 7, 1); }
function schoolYearMonths(){ const out=[], now=new Date(); for(let m=schoolYearStart(now); m<=now; m=new Date(m.getFullYear(),m.getMonth()+1,1)) out.push(ymKey(m)); return out; }
function range(p){
  const now=new Date();
  if(p==="week"){ const s=startOfWeek(now); const e=new Date(s); e.setDate(e.getDate()+7); return [s,e]; }
  if(p==="month"){ return [new Date(now.getFullYear(),now.getMonth(),1), new Date(now.getFullYear(),now.getMonth()+1,1)]; }
  const s=schoolYearStart(now); return [s, new Date(s.getFullYear()+1, 7, 1)];
}
const PERIOD_LABEL = {week:"This week", month:"This month", year:"This year"};
const fmtDate = d => d.toLocaleDateString(undefined,{day:"numeric",month:"short"});
function periodCaption(p){
  const [s,e]=range(p); const last=new Date(e); last.setDate(last.getDate()-1);
  if(p==="year") return `${s.getFullYear()}–${String(s.getFullYear()+1).slice(2)} school year`;
  if(p==="month") return s.toLocaleDateString(undefined,{month:"long",year:"numeric"});
  return `${fmtDate(s)} – ${fmtDate(last)}`;
}
function inPeriod(p){ const [s,e]=range(p); return entries.filter(x=>x.ts>=s.getTime() && x.ts<e.getTime()); }
function totals(list){ const t={camels:0,dhows:0,falcons:0,khanjars:0,none:0}; list.forEach(x=>{ if(t[x.house]!=null) t[x.house]+=x.pts; else t.none+=x.pts; }); return t; }
function ago(ts){
  const m=Math.round((Date.now()-ts)/60000);
  if(m<1) return "just now"; if(m<60) return m+" min ago";
  const h=Math.round(m/60); if(h<24) return h+" h ago";
  return new Date(ts).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
}

// forgiving text for search: ignores case, accents, curly apostrophes, punctuation and titles like Ms or Mr
function norm(s){ return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[\u2018\u2019\u02bc`´']/g,"").replace(/[^a-z0-9]+/g," ").trim(); }
function queryWords(q){ return norm(q).split(" ").filter(w=>w && !TITLES.has(w)); }
function matches(hay, words){ const h=" "+norm(hay)+" "; return words.every(w=>h.includes(" "+w) || (w.length>=3 && h.includes(w))); }
const plural = (n,w) => `${n} ${w}${n===1?"":"s"}`;

function rebuildRoster(){
  S={}; const forms=new Set();
  Object.entries(rosterDocs).forEach(([doc,b])=>(b.students||[]).forEach(s=>{ S[s.no]={...s, doc}; forms.add(s.form); }));
  FORMS=[...forms].sort((a,b)=>{ const ya=parseInt(a.slice(1)), yb=parseInt(b.slice(1)); return ya-yb || a.localeCompare(b); });
}
function resolveEntries(){
  entries = rawEntries.map(e=>{
    const s = e.sno && S[e.sno];
    return {...e, house: s ? s.house : (e.house||""), name: s ? s.name : (e.student||""), form: s ? s.form : (e.cls||"")};
  });
}

  const mark=k=>{ got[k]=true; if(got.t&&got.l&&got.r && dbState==="loading"){ dbState="ready"; refresh(); syncAll(); } else refresh(); };
  const fail=k=>err=>{ console.warn(k, err); failed=true; mark(k); };
  db.collection("teachers").onSnapshot(snap=>{
    teachers = snap.docs.map(d=>({id:d.id, ...d.data()})).filter(t=>t.name).sort((a,b)=>a.name.localeCompare(b.name));
    mark("t");
  }, fail("t"));
  db.collection("roster").onSnapshot(snap=>{
    rosterDocs = {}; snap.docs.forEach(d=>rosterDocs[d.id]=d.data()); rebuildRoster(); resolveEntries(); mark("r");
  }, fail("r"));
  const months=schoolYearMonths();
  months.unshift(ymKey(new Date(schoolYearStart(new Date()).getTime()-86400000)));
  db.collection("log").where("month","in",months).onSnapshot(snap=>{
    const out=[];
    snap.docs.forEach(d=>{ const b=d.data()||{}; (b.entries||[]).forEach(e=>out.push({...e, teacherId:e.teacherId||b.teacherId, teacherName:e.teacherName||b.teacherName, docId:d.id})); });
    rawEntries = out.sort((a,b)=>b.ts-a.ts); resolveEntries();
    mark("l");
  }, fail("l"));
}

const queues = {};
function queued(key, fn){ const p=(queues[key]||Promise.resolve()).then(fn,fn); queues[key]=p.catch(()=>{}); return p; }

// all points for one week live in one document; a very busy week rolls into a second part
async function addEntries(teacher, list){
  const wk = startOfWeek(new Date(list[0].ts));
  const base = "w" + ymKey(wk) + "-" + String(wk.getDate()).padStart(2,"0");
  const month = ymKey(wk);
  const stamped = list.map(e=>({...e, teacherId:teacher.id, teacherName:teacher.name}));
  for(let part=1; part<50; part++){
    const ref = db.doc("log/" + (part===1 ? base : base + "__" + part));
    const ok = await db.runTransaction(async tx=>{
      const snap = await tx.get(ref);
      const cur = snap.exists ? (snap.data().entries||[]) : [];
      if(cur.length && JSON.stringify(cur).length + JSON.stringify(stamped).length > 700000) return false;
      if(snap.exists) tx.update(ref, {entries: firebase.firestore.FieldValue.arrayUnion(...stamped)});
      else tx.set(ref, {month, week:base, entries:stamped});
      return true;
    });
    if(ok) return;
  }
  throw new Error("full");
}
async function removeEntry(docId, entryId){
  const ref = db.doc("log/"+docId);
  await db.runTransaction(async tx=>{
    const snap = await tx.get(ref); if(!snap.exists) return;
    tx.update(ref, {entries:(snap.data().entries||[]).filter(e=>e.id!==entryId)});
  });
}
async function clearAllPoints(){
  const ids=[...new Set(entries.map(e=>e.docId))];
  for(const id of ids){ await db.doc("log/"+id).delete(); }
  return ids.length;
}
// house changes: map of student no -> house id
async function setHouses(changes){
  const byDoc={};
  Object.entries(changes).forEach(([no,h])=>{ const s=S[no]; if(s) (byDoc[s.doc] ||= {})[no]=h; });
  await Promise.all(Object.entries(byDoc).map(([doc,ch])=>queued("roster/"+doc, async ()=>{
    const ref=db.doc("roster/"+doc); const snap=await ref.get(); if(!snap.exists) return;
    const b=snap.data();
    await ref.set({...b, students:(b.students||[]).map(s=> ch[s.no]!==undefined ? {...s, house:ch[s.no]} : s)});
  })));
}
function errMsg(e){
  if(e && e.code==="permission-denied") return "You don't have permission to change that. Ask the organiser.";
  if(e && e.code==="resource-exhausted") return "The app has hit today's free limit. It will work again tomorrow.";
  return "That didn't save. Check your connection and try again.";
}

let downloads=null;
const csvCell = v => { const t=String(v==null?"":v); return /[",\n\r]/.test(t) ? `"${t.replace(/"/g,'""')}"` : t; };
const toCsv = rows => rows.map(r=>r.map(csvCell).join(",")).join("\r\n");
const levelName = p => (LEVELS.find(l=>l.pts===p)||{}).name || "";
const stamp = () => new Date().toISOString().slice(0,10);
function exportAll(){
  const rows=[["Date","Time","Student","Student number","Form","House","Points","Level","Reason","Teacher"]];
  [...entries].sort((a,b)=>a.ts-b.ts).forEach(x=>{ const d=new Date(x.ts);
    rows.push([d.toLocaleDateString("en-GB"), d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}),
      x.name||"", x.sno||"", x.form||"", HMAP[x.house]?HMAP[x.house].name:"No house yet",
      x.pts, levelName(x.pts), x.reason||"", teacherName(x.teacherId)||x.teacherName||""]); });
  return rows;
}
function exportStudents(){
  const by={};
  entries.forEach(x=>{ const k=x.sno||("legacy:"+x.name); if(!x.sno && !x.name) return;
    (by[k] ||= {no:x.sno||"", name:x.name||"", form:x.form||"", house:x.house, pts:0, n:0}); by[k].pts+=x.pts; by[k].n++; });
  const rows=[["Student","Student number","Form","House","Total points","Awards"]];
  Object.values(by).sort((a,b)=>b.pts-a.pts).forEach(s=>rows.push([s.name, s.no, s.form, HMAP[s.house]?HMAP[s.house].name:"No house yet", s.pts, s.n]));
  return rows;
}
function exportHouses(){
  const t=totals(entries);
  const rows=[["House","Total points","Awards","Students in house"]];
  HOUSES.forEach(h=>rows.push([h.name, t[h.id], entries.filter(x=>x.house===h.id).length, Object.values(S).filter(s=>s.house===h.id).length]));
  rows.push(["No house yet", t.none, entries.filter(x=>!HMAP[x.house]).length, Object.values(S).filter(s=>!HMAP[s.house]).length]);
  return rows;
}
async function save(name, rows){
  const blob = new Blob(["﻿"+toCsv(rows)], {type:"text/csv"});
  try{
    const file = new File([blob], name, {type:"text/csv"});
    if(/iPhone|iPad|iPod|Android/i.test(navigator.userAgent) && navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:name}); return;
    }
  }catch(err){ if(err && err.name==="AbortError") return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast("Saved "+name);
}

function searchStudents(q, limit=10){
  const words=queryWords(q); if(norm(q).length<2 || !words.length) return [];
  const all=Object.values(S);
  const exactForm = all.filter(s=>norm(s.form)===words.join(""));
  if(exactForm.length) return exactForm.sort((a,b)=>a.name.localeCompare(b.name));
  return all.filter(s=>matches(s.name+" "+s.no+" "+s.form, words))
    .sort((a,b)=>a.name.localeCompare(b.name)).slice(0,limit);
}

      <div class="grid">${ts.map(card).join("")}</div>
    </section>`).join("");
}

/* teacher page */
let form = {sel:[], pts:1, openForm:""};
let formTeacher = null, editingHouse=false;
function renderTeacher(id){
  const t=teachers.find(x=>x.id===id);
  const app=$("#app");
  if(!t){ app.innerHTML = `<a class="back" href="#/teachers">← All teachers</a><p class="empty" style="margin-top:16px">${dbState==="loading"?"Loading…":"This teacher isn't on the list anymore."}</p>`; return; }
  if(formTeacher!==id){ form={sel:[], pts:1, reason:"", openForm:myFormsOf(t)[0]||""}; formTeacher=id; editingHouse=false; }
  app.innerHTML = `${notice()}
    <a class="back" href="#/teachers">← All teachers</a>
    <h1 style="margin-top:10px">${esc(t.name)}</h1>
    <div id="myHouse" style="margin-top:10px"></div>
    <form class="panel award" id="award">
      <div class="step"><span class="lbl">Students</span>
        <div class="pickgrid">
          <div>
            <label for="sq" class="hint">Search the whole school by name, student number or form group</label>
            <input class="field" id="sq" type="search" style="width:100%;margin-top:4px" placeholder="e.g. Adam or Y7CC" autocomplete="off">
            <ul class="results" id="sres"></ul>
          </div>
          <div>
            <span class="hint">My form groups</span>
            <div class="chips" id="myForms" style="margin-top:4px"></div>
            <div id="formStudents"></div>
          </div>
        </div>
      </div>
      <div class="step"><span class="lbl" id="selLbl">Selected</span><div class="tray" id="tray" aria-labelledby="selLbl"></div></div>
      <div class="step"><span class="lbl" id="pl">Points each</span>
        <div class="levels" role="group" aria-labelledby="pl">${LEVELS.map(l=>`<button type="button" class="lvl" style="--lc:${l.c}" data-p="${l.pts}" aria-pressed="${form.pts===l.pts}">${l.pts===10?`<img class="mavsm" src="${MAVERICK}" alt="">`:""}<span class="n">${l.pts}<small>${l.pts===1?"pt":"pts"}</small></span><span class="t">${l.name}</span><span class="d">${l.desc}</span></button>`).join("")}</div></div>
      <div class="step"><span class="lbl" id="rl">Reason</span>
        <div role="group" aria-labelledby="rl">
          <div class="rgroup"><span class="hint">IB learner profile</span>
            <div class="chips">${PROFILE.map(([r,d])=>`<button type="button" class="chip rchip" data-r="${r}" title="${d}" aria-pressed="${form.reason===r}">${r}</button>`).join("")}</div></div>
          <div class="rgroup"><span class="hint">Everyday</span>
            <div class="chips">${SCHOOL.map(r=>`<button type="button" class="chip rchip" data-r="${r}" aria-pressed="${form.reason===r}">${r}</button>`).join("")}<button type="button" class="chip rchip add" data-r="__other" aria-pressed="${form.reason==="__other"}">Other…</button></div></div>
        </div>
        <p class="hint" id="rsnDesc" style="margin:8px 0 0">${PROFILE_DESC[form.reason]?`${form.reason}: ${PROFILE_DESC[form.reason]}`:""}</p>
        <input class="field" id="rsnOther" maxlength="80" autocomplete="off" placeholder="Type another reason" aria-label="Other reason" style="width:100%;max-width:420px;margin-top:8px;${form.reason==="__other"?"":"display:none"}"></div>
      <div class="submit"><button class="btn" id="go">Give points</button><span class="hint" id="goHint"></span></div>
    </form>
    <section class="panel" style="margin-top:20px"><h2>Your recent points</h2><ul class="rows" id="mine"></ul></section>
    ${isOwner?`<div class="danger"><button class="btn link" id="rm">Remove ${esc(t.name)} from the list</button></div>`:""}`;
  drawMyHouse(t); drawMyForms(t); drawTray();
  $("#sq").oninput = drawResults;
  app.querySelectorAll(".rchip").forEach(b=>b.onclick=()=>{
    form.reason = form.reason===b.dataset.r ? "" : b.dataset.r;
    app.querySelectorAll(".rchip").forEach(x=>x.setAttribute("aria-pressed", x.dataset.r===form.reason));
    const o=$("#rsnOther"); o.style.display = form.reason==="__other" ? "" : "none"; if(form.reason==="__other") o.focus();
    $("#rsnDesc").textContent = PROFILE_DESC[form.reason] ? `${form.reason}: ${PROFILE_DESC[form.reason]}` : "";
    syncGo();
  });
  $("#rsnOther").oninput = syncGo;
  app.querySelectorAll(".lvl").forEach(b=>b.onclick=()=>{ form.pts=+b.dataset.p; app.querySelectorAll(".lvl").forEach(x=>x.setAttribute("aria-pressed",x===b)); syncGo(); });
  $("#award").onsubmit = async e=>{
    e.preventDefault();
    if(!form.sel.length || dbState!=="ready") return;
    const reason = form.reason==="__other" ? $("#rsnOther").value.trim() : form.reason, ts=Date.now();
    if(!reason) return;
    const list=form.sel.map(no=>({id:newId(), ts, pts:form.pts, sno:no, reason, house:S[no]?.house||""}));
    const go=$("#go"); go.disabled=true;
    try{
      await addEntries(t, list);
      toast(list.length===1 ? `+${form.pts} for ${S[list[0].sno]?.name||"student"}` : `+${form.pts} each for ${list.length} students`);
      form.sel=[]; drawTray(); drawResults(); drawFormStudents();
    }catch(err){ toast(errMsg(err)); }
    go.disabled=false; syncGo();
  };
  if($("#rm")) $("#rm").onclick = async ()=>{
    if(!confirm(`Remove ${t.name}? Points they already gave will still count.`)) return;
    try{ await db.doc("teachers/"+t.id).delete(); location.hash="#/teachers"; toast(`Removed ${t.name}`); } catch(err){ toast(errMsg(err)); }
  };
  syncGo(); updateMine();
}
const myFormsOf = t => (prefs[t.id]?.forms ?? t.classes ?? []);
async function saveForms(t, forms){ const prev=prefs[t.id]; prefs[t.id]={forms}; drawMyForms(t); try{ await db.doc("prefs/"+t.id).set({forms}); }catch(e){ prefs[t.id]=prev; drawMyForms(t); throw e; } }
function toggleStudent(no){
  const i=form.sel.indexOf(no); if(i>=0) form.sel.splice(i,1); else form.sel.push(no);
  drawTray(); drawResults(); drawFormStudents();
}
function studentBtn(s){
  const on=form.sel.includes(s.no);
  return `<li><button type="button" class="sbtn" data-s="${esc(s.no)}" aria-pressed="${on}">${dot(s.house)}<span class="grow"><b>${esc(s.name)}</b><span class="meta"> · ${esc(s.form)}</span></span><span class="tick">${on?"✓":"+"}</span></button></li>`;
}
function drawResults(){
  const box=$("#sres"); if(!box) return;
  const q=$("#sq").value; const res=searchStudents(q, 12);
  box.innerHTML = res.map(studentBtn).join("") || (norm(q).length>=2 ? `<li><p class="empty" style="padding:10px 12px">No student matches “${esc(q)}”.</p></li>` : "");
  box.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>toggleStudent(b.dataset.s));
}
function drawMyForms(t){
  const box=$("#myForms"); if(!box) return;
  const mine=myFormsOf(t).filter(f=>FORMS.includes(f));
  box.innerHTML = mine.map(f=>`<button type="button" class="chip" data-f="${esc(f)}" aria-pressed="${form.openForm===f}">${esc(f)}</button>`).join("")
    + `<span id="addFormWrap"><button type="button" class="chip add" id="addForm">+ Add form group</button></span>`;
  box.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ form.openForm = form.openForm===b.dataset.f ? "" : b.dataset.f; drawMyForms(t); });
  $("#addForm").onclick=()=>{
    $("#addFormWrap").innerHTML = `<span style="display:inline-flex;gap:6px"><select class="field" id="formSel" aria-label="Form group" style="padding:6px 8px"><option value="">Choose…</option>${FORMS.filter(f=>!mine.includes(f)).map(f=>`<option>${f}</option>`).join("")}</select><button type="button" class="btn link" id="cancelForm">Cancel</button></span>`;
    $("#formSel").focus();
    $("#formSel").onchange=async e=>{
      const v=e.target.value; if(!v) return;
      form.openForm=v;
      try{ await saveForms(t, [...mine, v]); }catch(err){ toast(errMsg(err)); drawMyForms(t); }
    };
    $("#cancelForm").onclick=()=>drawMyForms(t);
  };
  drawFormStudents();
}
function drawFormStudents(){
  const box=$("#formStudents"); if(!box) return;
  const f=form.openForm;
  if(!f){ box.innerHTML = `<p class="hint" style="margin:8px 0 0">${FORMS.length?"Add your form groups to see those students here.":""}</p>`; return; }
  const list=Object.values(S).filter(s=>s.form===f).sort((a,b)=>a.name.localeCompare(b.name));
  const allOn = list.length && list.every(s=>form.sel.includes(s.no));
  box.innerHTML = `<div class="linkrow"><b>${esc(f)}</b><span class="hint">· ${plural(list.length,"student")}</span>
      <button type="button" class="btn link" id="allForm">${allOn?"Clear all":"Select all"}</button>
      <button type="button" class="btn link" id="dropForm">Remove from my list</button></div>
    <div class="formlist">${list.map(s=>`<button type="button" class="schip" data-s="${esc(s.no)}" aria-pressed="${form.sel.includes(s.no)}">${dot(s.house)}${esc(s.name)}</button>`).join("")}</div>`;
  box.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>toggleStudent(b.dataset.s));
  $("#allForm").onclick=()=>{ if(allOn) form.sel=form.sel.filter(n=>!list.some(s=>s.no===n)); else list.forEach(s=>{ if(!form.sel.includes(s.no)) form.sel.push(s.no); }); drawTray(); drawResults(); drawFormStudents(); };
  $("#dropForm").onclick=async()=>{
    const t=teachers.find(x=>x.id===formTeacher); if(!t) return;
    form.openForm="";
    try{ await saveForms(t, myFormsOf(t).filter(x=>x!==f)); }catch(err){ toast(errMsg(err)); }
  };
}
function drawTray(){
  const box=$("#tray"); if(!box) return;
  const shown = form.sel.length>10 ? form.sel.slice(-8) : form.sel;
  box.innerHTML = form.sel.length ? (form.sel.length>10?`<b style="margin-right:6px">${form.sel.length} students selected, including</b>`:"") + shown.map(no=>{ const s=S[no]||{name:no,form:""}; return `<span class="schip">${dot(s.house)}${esc(s.name)} <span class="meta" style="opacity:.7">${esc(s.form)}</span><button type="button" class="x" data-x="${esc(no)}" aria-label="Remove ${esc(s.name)}">×</button></span>`; }).join("")
      + (form.sel.length>1?`<button type="button" class="btn link" id="clearSel">Clear</button>`:"")
    : `<p class="empty">Pick students from the search or your form groups.</p>`;
  box.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>toggleStudent(b.dataset.x));
  const c=$("#clearSel"); if(c) c.onclick=()=>{ form.sel=[]; drawTray(); drawResults(); drawFormStudents(); };
  syncGo();
}
function drawMyHouse(t){
  const box=$("#myHouse"); if(!box) return;
  if(!isOwner){ box.innerHTML = HMAP[t.house] ? `<span class="tag" style="${hvars(t.house)}"><img src="${CRESTS[t.house]}" alt="">${HMAP[t.house].name} teacher</span>` : ""; return; }
  if(!HMAP[t.house] || editingHouse){
    box.innerHTML = `<p class="hint" style="margin:0 0 8px">${HMAP[t.house]?"Move to a different house:":"The Maverick — across high school, not in a house. Pick one to change that:"}</p>
      <div class="housepick">${HOUSES.map(h=>`<button type="button" class="hchip" data-mh="${h.id}" style="${hvars(h.id)}" aria-pressed="${t.house===h.id}">${h.name}</button>`).join("")}
      ${editingHouse?`<button type="button" class="btn link" id="cancelH">Cancel</button>`:""}</div>`;
    box.querySelectorAll("[data-mh]").forEach(b=>b.onclick=async()=>{
      try{ await db.doc("teachers/"+t.id).update({house:b.dataset.mh}); editingHouse=false; toast(`${t.name} is in ${HMAP[b.dataset.mh].name}`); }
      catch(err){ toast(errMsg(err)); }
    });
    const c=$("#cancelH"); if(c) c.onclick=()=>{ editingHouse=false; drawMyHouse(t); };
  } else {
    box.innerHTML = `<span class="tag" style="${hvars(t.house)}"><img src="${CRESTS[t.house]}" alt="">${HMAP[t.house].name} teacher</span> <button type="button" class="btn link" id="chgH">Change</button>`;
    $("#chgH").onclick=()=>{ editingHouse=true; drawMyHouse(t); };
  }
}
function syncGo(){
  const go=$("#go"); if(!go) return;
  const n=form.sel.length;
  const reason = form.reason==="__other" ? ($("#rsnOther")?.value.trim()||"") : form.reason;
  go.disabled = !n || !reason || dbState!=="ready";
  go.textContent = n ? (n===1 ? `Give ${plural(form.pts,"point")} to ${S[form.sel[0]]?.name.split(" ")[0]||"student"}` : `Give ${plural(form.pts,"point")} each to ${n} students`) : "Give points";
  $("#goHint").textContent = !n ? "Choose at least one student." : !reason ? "Choose a reason." : "";
}
function updateMine(){
  const r=route(); const box=$("#mine"); if(!box || r.name!=="teacher") return;
  const mine=entries.filter(x=>x.teacherId===r.id).slice(0,20);
  box.innerHTML = mine.length ? mine.map(x=>`
    <li>${dot(x.house)}
      <div class="grow"><b>${esc(x.name||"Student")}</b>${x.form?` · ${esc(x.form)}`:""}
        <div class="meta">${HMAP[x.house]?.name||"No house yet"} · ${esc(x.reason||"House points")} · ${ago(x.ts)}</div></div>
      <span class="num">+${x.pts}</span>
      <button class="btn link" data-undo="${esc(x.docId)}|${esc(x.id)}" aria-label="Undo ${x.pts} points for ${esc(x.name)}">Undo</button></li>`).join("")
    : `<li><p class="empty">Points you give will show up here.</p></li>`;
  box.querySelectorAll("[data-undo]").forEach(b=>b.onclick=async()=>{
    const [d,i]=b.dataset.undo.split("|"); b.disabled=true;
    try{ await removeEntry(d,i); toast("Points removed"); }catch(err){ toast(errMsg(err)); b.disabled=false; }
  });
}

/* students & houses page */
let importPlan=null;
function renderStudents(){
  const app=$("#app");
  if(!isOwner){ app.innerHTML = `<h1>Students</h1><p class="sub">${dbState==="loading"?"Loading…":"Only the organiser can add students or change houses. Use Give points to reward students."}</p>`; return; }
  app.innerHTML = `${notice()}
    <h1>Students</h1>
    <p class="sub">Every student's points count for their house. Set houses here.</p>
    <div class="hsum" id="hsum"></div>
    <section class="panel">
      <h2>Import houses</h2>
      <p class="hint" style="margin:0 0 10px">Paste rows from a spreadsheet. Each row needs a student number (like M10794) or full name, and a house (Camels, Dhows, Falcons, Khanjars, or red, green, blue, yellow).</p>
      <textarea class="field" id="imp" aria-label="Rows to import" placeholder="M10794	Falcons&#10;M8259	Camels"></textarea>
      <div class="submit" style="margin-top:10px"><button class="btn ghost" id="check">Check rows</button><button class="btn" id="apply" disabled>Save houses</button><span class="hint" id="impMsg"></span></div>
      <div id="impIssues"></div>
    </section>
    <section class="panel" style="margin-top:20px">
      <h2>Restore from backup</h2>
      <p class="hint" style="margin:0 0 10px">Load a Meadows Mavericks backup file to bring in teachers, form groups and student houses. Anything with the same name is replaced.</p>
      <div class="submit"><input type="file" id="bk" accept=".json,application/json" class="field"><button class="btn" id="bkGo" disabled>Restore</button><span class="hint" id="bkMsg"></span></div>
    </section>
    <section class="panel" style="margin-top:20px">
      <h2>Find a student</h2>
      <input class="field" id="fq" type="search" placeholder="Name, student number or form group (e.g. Y9BB)" style="width:100%;max-width:480px" autocomplete="off">
      <div id="flist" style="margin-top:10px"></div>
    </section>`;
  $("#check").onclick=checkImport;
  $("#imp").oninput=()=>{ importPlan=null; $("#apply").disabled=true; $("#impMsg").textContent=""; $("#impIssues").innerHTML=""; };
  $("#apply").onclick=async()=>{
    if(!importPlan) return; const n=Object.keys(importPlan).length;
    $("#apply").disabled=true; $("#impMsg").textContent="Saving…";
    try{ await setHouses(importPlan); toast(`Saved houses for ${plural(n,"student")}`); $("#imp").value=""; $("#impMsg").textContent=""; $("#impIssues").innerHTML=""; importPlan=null; }
    catch(err){ toast(errMsg(err)); $("#impMsg").textContent=""; $("#apply").disabled=false; }
  };
  $("#fq").oninput=drawFind;
  let backup=null;
  $("#bk").onchange=async()=>{
    backup=null; $("#bkGo").disabled=true; const f=$("#bk").files[0]; if(!f) return;
    try{
      const b=JSON.parse(await f.text());
      if(b.format!=="meadows-mavericks-backup") throw 0;
      backup=b; const n=k=>Object.keys(b[k]||{}).length;
      $("#bkMsg").textContent=`${plural(n("teachers"),"teacher")}, ${plural(n("roster"),"year group")} found.`; $("#bkGo").disabled=false;
    }catch(e){ $("#bkMsg").textContent="That isn't a Meadows Mavericks backup file."; }
  };
  $("#bkGo").onclick=async()=>{
    if(!backup) return; $("#bkGo").disabled=true; $("#bkMsg").textContent="Restoring…";
    try{
      const ops=[]; ["teachers","roster","prefs","log"].forEach(c=>Object.entries(backup[c]||{}).forEach(([id,d])=>ops.push([c+"/"+id,d])));
      for(let i=0;i<ops.length;i+=400){ const b=db.batch(); ops.slice(i,i+400).forEach(([p,d])=>b.set(db.doc(p),d)); await b.commit(); }
      $("#bkMsg").textContent=""; toast(`Restored ${plural(ops.length,"record")}`); backup=null; $("#bk").value="";
    }catch(err){ toast(errMsg(err)); $("#bkMsg").textContent=""; $("#bkGo").disabled=false; }
  };
  updateStudents();
}
function checkImport(){
  const lines=$("#imp").value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const byName={}; Object.values(S).forEach(s=>{ const k=s.name.toLowerCase(); (byName[k] ||= []).push(s); });
  const plan={}, missing=[], noHouse=[];
  lines.forEach(line=>{
    const words=line.toLowerCase().split(/[^a-z]+/);
    const house = words.map(w=>HOUSE_WORDS[w]).filter(Boolean).pop();
    const num = (line.match(/\bM\d{3,}\b/i)||[])[0];
    let st = num ? S[num.toUpperCase()] : null;
    if(!st && !num){
      const cells=line.split(/\t|,|;/).map(c=>c.trim().replace(/\s+/g," ").toLowerCase()).filter(Boolean);
      for(const c of cells){ const m=byName[c]; if(m && m.length===1){ st=m[0]; break; } }
    }
    if(!house){ if(/\d|[a-z]{3}/i.test(line) && !/student|name|house/i.test(line)) noHouse.push(line); return; }
    if(!st){ missing.push(line); return; }
    plan[st.no]=house;
  });
  const n=Object.keys(plan).length;
  const changes=Object.entries(plan).filter(([no,h])=>S[no].house!==h).length;
  importPlan = n ? plan : null;
  $("#apply").disabled = !n;
  $("#impMsg").textContent = n ? `${plural(n,"student")} matched${changes!==n?`, ${changes} will change`:""}.` : "No rows matched a student and a house.";
  const lst=(title,arr)=>arr.length?`<p class="hint" style="margin:12px 0 4px"><b>${title} (${arr.length})</b></p><div class="table-wrap"><pre style="margin:0;font-size:.85rem;white-space:pre">${esc(arr.slice(0,30).join("\n"))}${arr.length>30?`\n…and ${arr.length-30} more`:""}</pre></div>`:"";
  $("#impIssues").innerHTML = lst("Student not found", missing) + lst("No house in the row", noHouse);
}
function updateStudents(){
  const box=$("#hsum"); if(!box) return;
  const all=Object.values(S);
  const c=h=>all.filter(s=>h?s.house===h:!HMAP[s.house]).length;
  box.innerHTML = HOUSES.map(h=>`<div style="${hvars(h.id)}"><b>${c(h.id)}</b><span>${h.name}</span></div>`).join("")
    + `<div><b>${c(null)}</b><span>No house yet</span></div>`;
  drawFind();
}
function drawFind(){
  const box=$("#flist"); if(!box) return;
  const q=$("#fq").value;
  if(dbState==="loading"){ box.innerHTML=`<p class="empty">Loading…</p>`; return; }
  const res=searchStudents(q, 40);
  if(norm(q).length<2){ box.innerHTML=`<p class="hint">${Object.keys(S).length} students across ${FORMS.length} form groups.</p>`; return; }
  box.innerHTML = res.length ? res.map(s=>`<div class="srow">${dot(s.house)}<div class="grow"><b>${esc(s.name)}</b><div class="meta">${esc(s.form)} · ${esc(s.no)}</div></div>
      <select class="field" data-hs="${esc(s.no)}" aria-label="House for ${esc(s.name)}"><option value="">No house yet</option>${HOUSES.map(h=>`<option value="${h.id}" ${s.house===h.id?"selected":""}>${h.name}</option>`).join("")}</select></div>`).join("")
    : `<p class="empty">No student matches “${esc(q)}”.</p>`;
  box.querySelectorAll("[data-hs]").forEach(sel=>sel.onchange=async()=>{
    const no=sel.dataset.hs; sel.disabled=true;
    try{ await setHouses({[no]:sel.value}); toast(`${S[no].name}: ${HMAP[sel.value]?.name||"no house"}`); }catch(err){ toast(errMsg(err)); }
    sel.disabled=false;
  });
}

function render(){
  if(dbState==="join"||dbState==="setup"){ renderGate(); window.scrollTo(0,0); return; }
  const r=route();
  document.querySelectorAll("nav a").forEach(a=>{
    const on = (a.dataset.nav==="home"&&r.name==="home")||(a.dataset.nav==="teachers"&&(r.name==="teachers"||r.name==="teacher"))||(a.dataset.nav==="students"&&r.name==="students");
    a.setAttribute("aria-current", on ? "page":"false");
  });
  if(r.name==="home") renderHome(); else if(r.name==="teachers") renderTeachers(); else if(r.name==="students") renderStudents(); else renderTeacher(r.id);
  window.scrollTo(0,0);
}
// live updates only touch the dynamic parts so typing is never interrupted
function refresh(){
  if(dbState==="join"||dbState==="setup") return;
  const r=route();
  if(r.name==="home") updateHome();
  else if(r.name==="teachers") updateTeachers();
  else if(r.name==="students"){ if(isOwner && !$("#hsum")) renderStudents(); else updateStudents(); }
  else {
    const t=teachers.find(x=>x.id===r.id);
    if(!$("#award") || !t) renderTeacher(r.id);
    else {
      drawMyHouse(t);
      if(!document.getElementById("formSel")) drawMyForms(t);
      drawResults(); drawTray(); updateMine();
    }
  }
}
window.addEventListener("hashchange", render);
render();
initDb();
setInterval(()=>{ if(dbState!=="join" && dbState!=="setup" && route().name==="home") updateHome(); }, 60000);
if("serviceWorker" in navigator) window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
